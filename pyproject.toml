[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code_dumper"
version = "1.0.0"
description = "Export entire codebases to a single, clean Markdown file for AI coding assistants."
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Farhad Akhtar", email = "183516667+farhadastro@users.noreply.github.com" }
]
keywords = ["code-dumper", "markdown", "llm-context", "ai-assistant", "codebase-exporter", "git"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
companion = [
    "watchdog>=4.0.0",
    "GitPython>=3.1.40",
]

[project.scripts]
codedumper = "codedumper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codedumper*", "autocommit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
